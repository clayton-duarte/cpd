[workspace]
resolver = "3"
members = ["core", "cli", "tui"]

[workspace.package]
version = "0.0.5"
edition = "2024"
publish = false

# Every dependency of cpd 2, declared once here. Later Jobs may not add any:
# the list and the reasons are in docs/implementing.md.
[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
minijinja = "3.0"
nix = { version = "0.31", features = ["fs", "poll", "process", "signal"] }
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
toml = "1.1"
tui-tree-widget = "0.24"
uuid = { version = "1.28", features = ["v4"] }
tempfile = "3.27"

# Deviation from the default (full debuginfo): tests-build-F2. Line tables keep
# backtraces and panics readable; a clean `test --workspace --no-run` (N=3)
# took 48-62 s and 4.7G of target/ with `true`, 33-40 s and 2.4G with this.
[profile.dev]
debug = "line-tables-only"

# Deviation from the default (opt-level 0 for everything): dependencies only.
# The tests spend their time in dependency code (rusqlite's bundled SQLite
# creating, migrating and checking a store at every `cpd` command and every
# `Store::open`; serde, toml, time, minijinja), and unoptimised that is several
# times slower (docs/research/test-speed.md §7.1). Only dependencies change: the
# workspace's own crates (cli, core, tui) stay at opt-level 0, so editing them
# recompiles as before. Cost: a clean build compiles the dependencies optimised.
[profile.dev.package."*"]
opt-level = 3
