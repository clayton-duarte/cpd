[workspace]
resolver = "3"
members = ["core", "cli", "tui"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

# Every dependency of cpd 2, declared once here. Later Jobs may not add any:
# the list and the reasons are in docs/implementing.md.
[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
minijinja = "3.0"
nix = { version = "0.31", features = ["fs", "process", "signal"] }
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
toml = "1.1"
tui-tree-widget = "0.24"
uuid = { version = "1.28", features = ["v4"] }
tempfile = "3.27"
