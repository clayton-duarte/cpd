name: E2E

# Non-blocking desktop e2e (plan desktop-e2e, job e2e-ci): the Playwright Electron suite on the
# self-hosted hs runner under a virtual display. Deliberately separate from ci.yml's Gate: this
# check is not in [pr] required_checks ("gate" only), so a failure surfaces as pr-feedback and
# never blocks a merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a newer run of the same pull request cancels the older one (each hs runner
# runs one job at a time).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      # clean: false keeps node_modules/ between runs in the runner's workspace, like ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          clean: false
      # Drop untracked leftovers of an earlier branch (not ignored files: node_modules/ stays).
      - name: Remove untracked files
        run: git clean -ffd
      # Like ci.yml, no setup steps: the runner provides node >= 22.19.0 (engines, package.json) and
      # pnpm 12.6.0 (packageManager, package.json).
      - name: Dependencies
        run: pnpm install --frozen-lockfile
      # pnpm-workspace.yaml sets allowBuilds.electron = false, so the frozen install leaves the
      # Electron binary out; this downloads it (web/package.json, e2e:install).
      - name: Electron binary
        run: pnpm --filter cpd-web-client run e2e:install
      # node-pty 1.1.0 ships Node-API prebuilds for darwin and win32 only, and pnpm-workspace.yaml
      # disables its build script (allowBuilds.node-pty: false), so a frozen install leaves no
      # pty.node on Linux. The app imports node-pty at load, so without it no window is ever
      # created (the e2e firstWindow/health timeouts). Build it from source with the node-gyp pnpm
      # already has; the module is Node-API, so Node's headers are enough for Electron.
      - name: node-pty native module
        if: runner.os == 'Linux'
        run: |
          cd web/node_modules/node-pty
          NODE_PATH="$GITHUB_WORKSPACE/node_modules/.pnpm/node_modules" \
            node -e "require('child_process').execFileSync(process.execPath, [require.resolve('node-gyp/bin/node-gyp.js'), 'rebuild'], { stdio: 'inherit' })"
      # The suite launches the built bundle (web/src/testing/e2e-fixtures.ts points Electron at
      # dist-electron/ and serves dist-electron/renderer/): build it as the `electron` script does,
      # minus its macOS-only plutil patch.
      - name: Desktop bundle
        run: pnpm --filter cpd-web-client run build:electron
      # Headless Electron on the runner is untried, so give the suite a virtual display; install
      # xvfb only if the runner lacks it.
      - name: Virtual display
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y xvfb
          fi
      # Isolation (air-d68): the fixtures give each test its own temp CPD_HOME and remove it, but
      # Electron's userData defaults to $HOME/.config/CPD — so the run gets a temp HOME, removed
      # when the step ends. TMPDIR lives under RUNNER_TEMP (not removed here) so the Playwright
      # output — each failure's error context and traces — survives for the upload step below;
      # that dir is removed by the final step.
      - name: E2E suite
        run: |
          home=$(mktemp -d)
          out="$RUNNER_TEMP/cpd-e2e"
          rm -rf "$out"
          mkdir -p "$out"
          trap 'rm -rf "$home"' EXIT
          HOME="$home" TMPDIR="$out" xvfb-run -a pnpm --filter cpd-web-client run e2e
      # Upload the Playwright output on failure (error contexts and traces) so the next red run is
      # diagnosable from the run page instead of a bare timeout.
      - name: Upload the Playwright output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-output
          path: ${{ runner.temp }}/cpd-e2e
          if-no-files-found: ignore
      # Remove the e2e temp (the upload step above has already read it).
      - name: Remove the e2e temp
        if: always()
        run: rm -rf "$RUNNER_TEMP/cpd-e2e"
