name: CI

# cpd's PR gate (hs-d16, hs-d17): the Gate, `npm run verify`, on the self-hosted runner on hs.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a newer push cancels the older run of a pull request (the runner runs one job at a time).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      # Full history: scripts/check-migrations-frozen.sh diffs against origin/main.
      # clean: false keeps target/ and node_modules/ between runs in the runner's workspace
      # (a clean checkout would rebuild everything each time).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          clean: false
      # Drop untracked leftovers of an earlier branch (not ignored files: target/ and node_modules/ stay).
      - name: Remove untracked files
        run: git clean -ffd
      # The Gate's stages (package.json, verify:steps) as separate steps, so the run shows where it spends time and what failed;
      # pi/test/gate.test.ts pins them equal. Each runs under gate-run.sh (the leak check); the first failure stops the job (hs-d355).
      # Installs node_modules when they are stale (the Gate does it in preverify).
      - name: Dependencies
        run: scripts/npm-fresh.sh
      - name: Migrations frozen
        run: scripts/gate-run.sh npm run verify:migrations
      - name: Portability
        run: scripts/gate-run.sh npm run verify:portable
      # tsc --noEmit: the repo's only static check besides the two above.
      - name: Typecheck
        run: scripts/gate-run.sh npm run typecheck
      - name: Node tests
        run: scripts/gate-run.sh npm run verify:node
      - name: pi check
        run: scripts/gate-run.sh npm run verify:pi
      # The Rust compiler: a compile error or warning shows here, apart from a failing test.
      - name: Rust build
        run: scripts/gate-run.sh npm run verify:build
      - name: Rust tests
        run: scripts/gate-run.sh npm run verify:rust
