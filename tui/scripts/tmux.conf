# Cockpit tmux config (the live server is tmux -L cpd; checks use a scratch server).
set -g mouse on
set -g focus-events on
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -as terminal-features ',xterm*:extkeys,xterm-ghostty:extkeys'
set -g escape-time 10
set -g status off
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-format '#{?#{@session_id},,#{?#{==:#{@view},statusbar},,#{?#{==:#{@view},worker}, Worker · #{@job} (read-only) ,#{?#{==:#{@view},context}, Context ,#{?#{==:#{@view},plan}, Plan ,#{?#{==:#{@view},dispatch}, Dispatch ,#{pane_current_command}}}}}}}'
set -g pane-active-border-style fg=blue
set -g remain-on-exit on
set-hook -g pane-died "respawn-pane"
# A click on the StatusBar pane is passed to it and does not select it, so the chat keeps keyboard focus.
# Every other pane keeps tmux's default (select the pane, then pass the click).
bind -T root MouseDown1Pane if -F '#{==:#{@view},statusbar}' 'send-keys -M' 'select-pane -t = ; send-keys -M'
