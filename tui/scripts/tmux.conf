# Cockpit tmux config (the live server is tmux -L cpd; checks use a scratch server).
set -g mouse on
set -g focus-events on
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -as terminal-features ',xterm*:extkeys,xterm-ghostty:extkeys'
set -g escape-time 10
set -g status off
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-format '#{?#{@session_id},,#{?#{==:#{@view},worker}, Worker · #{@job} (read-only) ,#{?#{==:#{@view},context}, Context ,#{?#{==:#{@view},plan}, Plan ,#{?#{==:#{@view},dispatch}, Dispatch ,#{pane_current_command}}}}}}'
set -g pane-active-border-style fg=cyan
set -g remain-on-exit on
set-hook -g pane-died "respawn-pane"
