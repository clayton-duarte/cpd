# git-cliff, run by the pre-release-hook of release.toml (docs/release.md).
# main's subjects are prose PR titles plus " (#n)", not Conventional Commits: a flat list.
[changelog]
header = """
# Changelog

"""
body = """
{% if previous.version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}
{% else %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}

First tagged release: the Rust cpd, event protocol 4. Earlier history: git log.

{% endif %}\
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
tag_pattern = "v[0-9]*"
commit_parsers = [
  { message = "^Release ", skip = true },
]
