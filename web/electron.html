<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CPD</title>
    <style>
      html, body { margin: 0; overflow: hidden; height: 100%; background: #1c1a20; color: #d8d2cc; }
      #tab-bar { display: flex; align-items: flex-end; gap: 4px; height: 30px; padding: 0 6px; box-sizing: border-box; background: #14121a; }
      #tab-bar .tab { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: none; border-radius: 6px 6px 0 0; background: transparent; color: inherit; font: inherit; cursor: default; }
      #tab-bar .tab.active { outline: 2px solid #ecaec7; outline-offset: -2px; }
      #tab-bar .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: #87808c; }
      #tab-bar .tab .dot.connecting { background: #c29653; }
      #tab-bar .tab .dot.live { background: #8da96e; }
      #tab-bar .tab .dot.exited { background: #87808c; }
      #tab-bar .tab .dot.failed { background: #e17f6e; }
      #tab-bar .tab .state { font-size: 11px; opacity: 0.7; }
      #terminal { position: absolute; top: 30px; left: 0; right: 0; bottom: 0; }
      #terminal .pane { width: 100%; height: 100%; }
      #webui-root { position: absolute; top: 30px; left: 0; right: 0; bottom: 0; overflow: auto; }
      #tab-bar[hidden] ~ #webui-root { top: 0; }
      #terminal, #terminal canvas { cursor: default !important; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <nav id="tab-bar"></nav>
    <div id="terminal"></div>
    <div id="webui-root" hidden></div>
    <script type="module" src="/src/electron/renderer.ts"></script>
  </body>
</html>
