# cargo-nextest (https://nexte.st/docs/configuration/): the Gate (`npm run
# verify`) and CI run `cargo nextest run --workspace`, which runs every test in
# a process of its own, all at once (docs/implementing.md).
# Everything not set here is nextest's default.

# No test group is needed: nothing in the tests shares process state. ETXTBSY
# (a fork while a script is open for writing) is handled in `cli/tests/it/common`;
# under nextest each test is a process of its own, so no fork can hold another
# test's descriptors. A test that must not overlap others goes in a test group
# here (`[test-groups]`, `max-threads = 1`, and a `[[profile.default.overrides]]`
# with a `filter` and `test-group`), the reason beside it. The integration tests are
# one binary, `cpd::it`, a module per file: select a file's tests with
# `filter = 'binary_id(cpd::it) and test(/^host::/)'`.

# hs-d236: a red run lists every failing test, not only the first.
[profile.default]
fail-fast = false
