# cargo-nextest (https://nexte.st/docs/configuration/): the Gate (`npm run
# verify`) and CI run `cargo nextest run --workspace`, which runs every test in
# a process of its own and the test binaries in parallel (docs/implementing.md).
# Everything not set here is nextest's default.

# Test groups: the tests of a group run one at a time (`max-threads = 1`),
# whatever else runs. A test file that serialises its own tests with an
# in-process lock gets a group with the same effect: `cargo test` runs the
# tests of a binary as threads of one process, where the lock holds them back;
# nextest gives each test a process of its own, where the lock holds nothing
# back, so the group does it.
[test-groups]
# cli/tests/host.rs, `TMUX_ENV`: every test points the process-wide
# `TMUX_TMPDIR` at its own TestEnv before it starts tmux.
tmux-env = { max-threads = 1 }
# cli/tests/driver_reload.rs, `ONE_AT_A_TIME`: every test writes executables and
# runs them; a thread that forks while another has such a file open for writing
# makes its exec fail with ETXTBSY ("Text file busy").
driver-reload = { max-threads = 1 }

# hs-d236: a red run lists every failing test, not only the first.
[profile.default]
fail-fast = false

[[profile.default.overrides]]
filter = 'binary_id(cpd::host)'
test-group = 'tmux-env'

[[profile.default.overrides]]
filter = 'binary_id(cpd::driver_reload)'
test-group = 'driver-reload'
