[pre-start]
deps = "npm ci --no-audit --no-fund"

# R19/R20: per Job, only the quick check at submit (pre-commit); the full Gate (pre-merge) runs at pr open and pr rebase.
[pre-commit]
typecheck = "npm run typecheck || exit 64"
cargo = "scripts/cargo.sh build --workspace || exit 64"

# Temporary: Attempts started before cpd 1's R19 change went live still run pre-merge after their merge,
# so pre-merge stays the fast check until they have merged.
# Then restore: verify = "npm run verify || exit 64" (the full Gate, run only at pr open / pr rebase).
[pre-merge]
typecheck = "npm run typecheck || exit 64"
cargo = "scripts/cargo.sh build --workspace || exit 64"
