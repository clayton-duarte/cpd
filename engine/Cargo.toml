[package]
name = "cpd-engine"
description = "cpd: the engine and the health check (watch and doctor)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "cpd_engine"
path = "src/lib.rs"

[dependencies]
cpd-core = { path = "../core" }
clap.workspace = true
nix.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true

[dev-dependencies]
# Not used by engine. It makes `-p cpd-engine` resolve dependency features as
# `--workspace` does: ratatui is what enables rustix `termios`/`stdio`,
# hashbrown 0.16's features, syn `extra-traits` and time `local-offset`. Without
# it the first `-p cpd-engine` run after a workspace build rebuilt 11
# dependencies. Dev-only: engine's library and `cargo build` never see ratatui.
# The same as core's; `layout::every_member_resolves_the_features_of_the_workspace_build`
# fails for a member without it.
ratatui.workspace = true
tempfile.workspace = true
