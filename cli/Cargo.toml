[package]
name = "cpd"
description = "cpd 2: the Rust rewrite of cpd"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "cpd"
path = "src/main.rs"

[[bin]]
name = "fake-tmux"
path = "src/bin/fake-tmux.rs"
required-features = ["fakes"]

[features]
fakes = ["cpd-core/fakes"]

[dependencies]
cpd-core = { path = "../core" }
cpd-engine = { path = "../engine" }
clap.workspace = true
nix.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true

[dev-dependencies]
cpd-core = { path = "../core", features = ["fakes"] }
ratatui.workspace = true
tempfile.workspace = true
sha2.workspace = true
toml.workspace = true
cpd = { path = ".", features = ["fakes"] }
assert_cmd = "=2.2.2"
