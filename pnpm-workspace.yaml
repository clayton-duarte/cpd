# pnpm 12 refuses dependency build scripts that are not listed; the `prepare` of @google/genai
# and the `postinstall` of protobufjs are not needed. `electron` (binary download) and `node-pty`
# (Node-API prebuilds ship in the package) need no build; tree-sitter-bash uses its shipped WASM,
# not its native binding. A frozen install needs no compiler.
allowBuilds:
  '@google/genai': false
  electron: false
  electron-winstaller: false
  node-pty: false
  protobufjs: false
  tree-sitter-bash: false

minimumReleaseAgeExclude:
  - electron@45.2.2
  - '@earendil-works/pi-agent-core@1.5.2'
  - '@earendil-works/pi-ai@1.5.2'
  - '@earendil-works/pi-codemode@1.5.2'
  - '@earendil-works/pi-coding-agent@1.5.2'
  - '@earendil-works/pi-mcp@1.5.2'
  - '@earendil-works/pi-schema@1.5.2'
  - '@earendil-works/pi-telemetry@1.5.2'
  - '@earendil-works/pi-tui@1.5.2'

packages:
  - 'web/'

patchedDependencies:
  '@aurigax-ai/ghostty-web@0.3.9': patches/@aurigax-ai__ghostty-web@0.3.9.patch
