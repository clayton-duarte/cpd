# cpd's compiled default policy (contract §8.3): every domain, parsed by the
# same loader as every scope file. Every `text` is empty.
# The repo-only domains (hooks, test-commands, protected) have no `text`: no hook, no test commands, no protected path.

[gate]
merge = "none"
pr = "none"
text = ""

[pr]
jira_required = false
text = ""

[pr.feedback]
checks = "any"

[pr.post]
enabled = false
channel = ""
template = "{{ title }}\n{{ url }}"
merged_reaction = ""

[deploy]
text = ""

[code]
text = ""

[tests]
text = ""

[monitor]
text = ""

[instructions]
text = ""

[model]
O = "github-copilot/claude-opus-5.5"
S = "github-copilot/claude-sonnet-5.5"
H = "github-copilot/claude-haiku-4.5"
G = "github-copilot/gemini-3.8-flash"

[hooks]

[test-commands]

[protected]
paths = []

[resources]

[deploys]
workflows = []
