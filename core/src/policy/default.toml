# cpd's compiled default policy (contract §8.3): every domain, parsed by the
# same loader as every scope file. Every `text` is empty.
# The repo-only domains (hooks, test-commands, protected, generated) have no `text`: no hook, no test commands, no
# protected path, no generated path.

[gate]
merge = "none"
pr = "none"
text = ""

[pr]
human_gated_contexts = ["UI Review", "UI Tests"]
excused_labels = []
required_checks = []
text = ""

[workflow]
jira_required = false
text = ""

[pr.feedback]
checks = "any"
reply = "all"

[pr.post]
enabled = false
require_approval = false
channel = ""
template = "{{ title }}\n{{ url }}"
merged_reaction = ""

[pr.jira]
in_progress = ""
in_review = ""
done = ""
# Jira custom field ids set to 1 before the Done move when empty; none means no estimate is written.
estimate_fields = []

[deploy]
text = ""

[code]
text = ""

[tests]
text = ""

[monitor]
text = ""

[instructions]
text = ""

[model]
O = "github-copilot/claude-opus-5.5"
S = "github-copilot/claude-sonnet-5.5"
H = "github-copilot/claude-haiku-4.5"
G = "github-copilot/gemini-3.8-flash"
J = "github-copilot/gemini-3.8-flash"

[hooks]

[test-commands]

[protected]
paths = []

[generated]
paths = []

[resources]

[deploys]
workflows = []
