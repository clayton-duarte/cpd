[package]
name = "cpd-core"
description = "cpd: the shared core (every area except the root command tree and the cockpit)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "cpd_core"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
minijinja.workspace = true
nix.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
toml.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc.workspace = true

[dev-dependencies]
# Not used by core. It makes `-p cpd-core` resolve dependency features as
# `--workspace` does: ratatui is what enables rustix `termios`/`stdio`,
# hashbrown 0.16's features, syn `extra-traits` and time `local-offset`. Without
# it the first `-p cpd-core` run after a workspace build rebuilt 12 dependencies
# (20-30 s). Dev-only: core's library and `cargo build` never see ratatui.
ratatui.workspace = true
tempfile.workspace = true
